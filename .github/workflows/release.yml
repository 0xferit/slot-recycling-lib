name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 'lts/*'

      - name: Install semantic-release and Claude Code
        run: |
          # claude-code: postinstall fetches its native binary, so no --ignore-scripts;
          # the exact version pin fixes the script content instead.
          npm install -g @anthropic-ai/claude-code@2.1.156
          npm install --no-save --ignore-scripts \
            semantic-release@25.0.3 \
            @semantic-release/changelog@6.0.3 \
            @semantic-release/exec@7.1.0 \
            @semantic-release/git@10.0.1 \
            @semantic-release/github@12.0.8 \
            conventional-changelog-conventionalcommits@9.3.1

      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          BEFORE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          npx semantic-release
          git fetch --tags
          AFTER_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$BEFORE_TAG" != "$AFTER_TAG" ]; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=${AFTER_TAG#v}" >> $GITHUB_OUTPUT
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
          fi

  soldeer-publish:
    name: Publish to Soldeer
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0
        with:
          version: v1.5.1

      - name: Publish to Soldeer registry
        env:
          SOLDEER_API_TOKEN: ${{ secrets.SOLDEER_API_TOKEN }}
        run: |
          if [ -z "$SOLDEER_API_TOKEN" ]; then
            echo "::error::SOLDEER_API_TOKEN secret is not set"
            exit 1
          fi
          VERSION=${{ needs.release.outputs.new_release_version }}
          echo "Publishing slot-recycling-lib~$VERSION to Soldeer..."
          forge soldeer push slot-recycling-lib~"$VERSION" --skip-warnings 2>&1 | tee /tmp/soldeer-output.log
          if grep -q "error during" /tmp/soldeer-output.log; then
            echo "::error::Soldeer push failed"
            exit 1
          fi

      - name: Tag last Soldeer publish
        run: |
          git tag -f soldeer-published
          git push origin soldeer-published --force
