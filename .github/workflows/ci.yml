name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kontrol_inputs:
    name: Check Kontrol inputs
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      required: ${{ steps.compare.outputs.required }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find a verified main revision
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f status=success -F per_page=1 \
            --jq '.workflow_runs[] | select(.head_repository.full_name == .repository.full_name) | .head_sha') || sha=
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Compare proof inputs
        id: compare
        env:
          VERIFIED_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          if bash scripts/kontrol-inputs-match.sh "$VERIFIED_SHA" "$GITHUB_SHA"; then
            echo "Kontrol inputs match verified main revision $VERIFIED_SHA"
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "Running Kontrol because proof inputs changed or a matching baseline is unavailable"
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Check Kontrol input selection
        run: bash test/ci/kontrol-inputs.sh

      - name: Check release tooling
        run: python3 -B -m unittest discover -s test/release -v

      - name: Install pinned Forge
        run: bash scripts/install-ci-forge.sh

      - name: Cache Soldeer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: dependencies
          key: soldeer-${{ hashFiles('soldeer.lock') }}

      - name: Install dependencies
        run: forge soldeer install

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vvv

  kontrol:
    name: Kontrol Formal Verification
    needs: kontrol_inputs
    if: ${{ !cancelled() && needs.kontrol_inputs.outputs.required != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install pinned Forge
        run: bash scripts/install-ci-forge.sh

      - name: Cache Soldeer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: dependencies
          key: soldeer-${{ hashFiles('soldeer.lock') }}

      - name: Install dependencies
        run: forge soldeer install

      - name: Add swap space
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Run Kontrol proofs
        env:
          KONTROL_IMAGE: runtimeverificationinc/kontrol:ubuntu-jammy-1.0.231@sha256:e1cb5da4e62712ded9056664f628db5a8d187394d81491d6ac562f579e02a79c
        run: |
          mkdir -p .kontrol out cache
          chmod 755 .kontrol out cache
          docker run --rm \
            --user root \
            -e "HOST_UID=$(id -u)" \
            -e "HOST_GID=$(id -g)" \
            -e "PYTHONPATH=/home/user/.local/lib/python3.10/site-packages" \
            -e "XDG_CACHE_HOME=/home/user/.cache" \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            "${KONTROL_IMAGE}" \
            bash -lc '
              set -euo pipefail
              trap "chown -R ${HOST_UID}:${HOST_GID} .kontrol out cache || true" EXIT
              rm -f /home/user/.local/lib/python3.10/site-packages/typing.py
              kontrol build --verbose --config-file kontrol.toml --config-profile ci
              kontrol prove --verbose --config-file kontrol.toml --config-profile ci \
                --reinit \
                --match-test "ProofSlotRecyclingSolidity.prove_.*_reverts"
            '
